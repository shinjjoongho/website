<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MoodLink | 제품 소개</title>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(180deg, #fff, #e6f2ff);
      text-align: center;
      padding: 80px 20px;
      color: #333;
    }
    h1 {
      font-size: 2.3em;
      margin-bottom: 30px;
    }
    .product {
      display: inline-block;
      width: 260px;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-radius: 10px;
      margin: 20px;
      padding: 20px;
    }
    img {
      width: 100%;
      border-radius: 10px;
    }
    h2 {
      margin-top: 15px;
      font-size: 1.3em;
    }
    p {
      font-size: 0.95em;
      color: #555;
    }
    a {
      display: inline-block;
      margin-top: 15px;
      text-decoration: none;
      background: #2ec5ff;
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      transition: 0.3s;
    }
    a:hover {
      background: #149edb;
    }
  </style>
</head>
<body>
  <h1>무드등1</h1>

  <div class="product">
    <img src="https://via.placeholder.com/250x200" alt="MoodLink Light 1">
    <h2>MoodLink Light 1</h2>
    <p>무드등2</p>
    <a href="#">상세보기</a>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/250x200" alt="MoodLink Light 2">
    <h2>MoodLink Light 2</h2>
    <p>사랑하는 사람과 연결되는 따뜻한 감정의 빛</p>
    <a href="#">상세보기</a>
  </div>

  <br><br>
  <a href="index.html">← 메인으로 돌아가기</a>
</body>
</html>
